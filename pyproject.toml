[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chessprogress"
version = "0.1.0"
description = "Analyse chess.com games for recurring weaknesses and publish progress reports to GitHub Pages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jamie Bull" }]
dependencies = [
    "chess>=1.11",
    "requests>=2.31",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
]

[project.scripts]
chess-progress = "chessprogress.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
